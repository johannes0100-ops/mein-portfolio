name: Live-Kurse

# GitHub startet geplante Abläufe oft nur alle 45 bis 60 Minuten statt wie eingestellt.
# Deshalb holt jeder Start die Kurse dreimal im Abstand von etwa 15 Minuten.
# Zeiten in UTC: 6 bis 21 Uhr UTC deckt die Tradegate-Handelszeit (8 bis 22 Uhr deutscher Zeit) in Winter- und Sommerzeit ab.
on:
  schedule:
    - cron: '*/15 6-21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/live_quotes.py'
      - '.github/workflows/live-kurse.yml'

permissions:
  contents: write

jobs:
  kurse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Kurse holen und speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          hole() {
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/live_quotes.py --feed data/feed.json --out data/live.json
            if git diff --quiet -- data/live.json; then echo "Keine Änderung"; return 0; fi
            git add data/live.json
            git commit -q -m "Live-Kurse aktualisiert"
            git push -q origin HEAD:main
          }
          for i in 1 2 3; do
            jetzt=$(TZ=Europe/Berlin date +%H%M)
            if (( 10#$jetzt < 745 || 10#$jetzt > 2215 )); then echo "Außerhalb der Handelszeit ($jetzt)"; break; fi
            hole || { sleep 5; hole || echo "Speichern fehlgeschlagen"; }
            if [ "$i" -lt 3 ]; then sleep 840; fi
          done
